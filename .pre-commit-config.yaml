repos:
  # ============================================================
  # 本地钩子
  # ============================================================
  # 注意: 版本号自动递增已移至 .git/hooks/post-commit，
  # 不再通过 pre-commit 框架管理（post-commit 阶段 + amend 方式）。

  # 铁律 8（口径见 REFACTORING.md 13.7）：单文件物理行数 ≤ 1000
  # 仅在本地提交阶段拦截，CI 不重复检查
  - repo: local
    hooks:
      - id: check-file-lines
        name: File Lines | 单文件行数上限检查
        entry: python .hooks/check_file_lines.py
        language: system
        types: [python]
        pass_filenames: true

  # ============================================================
  # Ruff — lint + format（等价 TS 生态 ESLint + Prettier）
  # 规则配置见 ruff.toml；版本升级改 rev 后跑 pre-commit install 一次即可
  # ============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # 先 lint 自动修复（import 排序/未用导入/现代化语法等）
      - id: ruff
        name: Ruff Lint | 代码规范检查（自动修复）
        args: ["--fix"]
      # 再 format（保证修复后的文件格式统一）
      - id: ruff-format
        name: Ruff Format | 代码格式化

  # ============================================================
  # 标准钩子
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # 尾部空白清理
      - id: trailing-whitespace
        name: Trailing Whitespace | 清理尾部空白
      # 文件末尾换行
      - id: end-of-file-fixer
        name: End of File | 文件末尾换行修复
      # YAML 语法检查
      - id: check-yaml
        name: Check YAML | YAML 语法检查
      # TOML 语法检查
      - id: check-toml
        name: Check TOML | TOML 语法检查
      # 大文件检查
      - id: check-added-large-files
        name: Large Files | 大文件检查
        args: ["--maxkb=500"]
      # 合并冲突标记检查
      - id: check-merge-conflict
        name: Merge Conflict | 合并冲突检查
