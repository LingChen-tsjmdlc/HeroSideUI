name: CI

on:
  push:
    branches: [main, ci/test-pipeline]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # 测试：按 (group × python-version) 矩阵并行
  #   group   : core / utils / animation / components-1..5 共 8 组并行
  #   python  : 3.11 / 3.12 / 3.13 三档并行
  # 总并行度 = 8 × 3 = 24 个 job 同时跑（受 GitHub Actions runner 配额限制）
  # components 按字母序动态分片（shard: "N/5"），新增测试文件无需改 CI
  # ============================================================
  test:
    name: Test | ${{ matrix.group.name }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 桌面 GUI 库在 CI 里只跑 macOS：
    # - macOS runner 原生 GUI 栈稳定，是真正可靠的测试信号。
    # - Ubuntu headless 下 Qt 6.11 对 xcb/字体/主题等依赖敏感，容易 SIGABRT。
    # - Windows runner 上 PySide6 6.11 + pytest-qt 存在已知 access violation
    #   （Button + QGraphicsEffect + installEventFilter 的组合）。
    # 非 macOS 平台靠 examples 人工验证，与同类库（PyQt-Fluent-Widgets 等）做法一致。
    strategy:
      matrix:
        os: [macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        group:
          - { name: core,         path: "tests/core" }
          - { name: utils,        path: "tests/utils" }
          - { name: animation,    path: "tests/animation" }
          - { name: "components-1", path: "tests/components", shard: "1/5" }
          - { name: "components-2", path: "tests/components", shard: "2/5" }
          - { name: "components-3", path: "tests/components", shard: "3/5" }
          - { name: "components-4", path: "tests/components", shard: "4/5" }
          - { name: "components-5", path: "tests/components", shard: "5/5" }
      fail-fast: false

    steps:
      - name: Checkout | 检出代码
        uses: actions/checkout@v4

      - name: Install uv | 安装 uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python | 安装 Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install deps | 安装依赖
        run: uv sync

      - name: Install test deps | 安装测试依赖
        run: uv add --dev pytest pytest-qt

      - name: Run ${{ matrix.group.name }} tests | 运行 ${{ matrix.group.name }} 测试
        run: |
          SHARD="${{ matrix.group.shard }}"
          if [ -n "$SHARD" ]; then
            # 动态分片：按字母序排列测试文件，取第 IDX 批（每批 PER 个）
            IDX="${SHARD%%/*}"
            TOTAL="${SHARD##*/}"
            ALL_FILES=$(ls ${{ matrix.group.path }}/test_*.py 2>/dev/null | sort)
            if [ -z "$ALL_FILES" ]; then
              echo "No test files found, skipping shard $IDX/$TOTAL"
              exit 0
            fi
            COUNT=$(echo "$ALL_FILES" | wc -l | tr -d ' ')
            PER=$(( (COUNT + TOTAL - 1) / TOTAL ))
            START=$(( (IDX - 1) * PER + 1 ))
            END=$(( IDX * PER ))
            FILES=$(echo "$ALL_FILES" | sed -n "${START},${END}p")
            if [ -z "$FILES" ]; then
              echo "Shard $IDX/$TOTAL is empty ($COUNT total files), skipping"
              exit 0
            fi
            echo "Shard $IDX/$TOTAL ($COUNT files, $PER per shard): $FILES"
            uv run python -m pytest $FILES -v --tb=short
          else
            uv run python -m pytest ${{ matrix.group.path }} -v --tb=short
          fi

  # ============================================================
  # 语法检查（与 test 并行）
  # ============================================================
  lint:
    name: Lint | 语法检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout | 检出代码
        uses: actions/checkout@v4

      - name: Install uv | 安装 uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python | 安装 Python
        run: uv python install 3.11

      - name: Install deps | 安装依赖
        run: uv sync

      - name: Compile check | 编译检查
        run: |
          find hero_side_ui -name "*.py" -exec uv run python -m py_compile {} \;
          echo "所有文件编译通过 ✅"

  # ============================================================
  # 导入检查：确保包能正常导入，所有组件可用（与 test/lint 并行）
  # ============================================================
  import-check:
    name: Import Check | 导入检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout | 检出代码
        uses: actions/checkout@v4

      - name: Install uv | 安装 uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python | 安装 Python
        run: uv python install 3.11

      - name: Install Qt system deps | 安装 Qt 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libfontconfig1

      - name: Install deps | 安装依赖
        run: uv sync

      - name: Import all components | 导入全部组件
        run: >-
          uv run python -c
          "from hero_side_ui import Button, Accordion, AccordionItem;
          from hero_side_ui.themes import HEROUI_COLORS, RADIUS, FONT_FAMILY, BUTTON_SIZES, ACCORDION_SIZES;
          from hero_side_ui.utils import hex_to_rgba, load_svg_icon;
          from hero_side_ui.animation import RippleOverlay, PressScaleEffect, CollapseAnimation;
          print('All imports OK')"

  # ============================================================
  # 构建检查：所有 test (24 个并行 job) + lint 都过后才跑
  # ============================================================
  build:
    name: Build | 构建检查
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout | 检出代码
        uses: actions/checkout@v4

      - name: Install uv | 安装 uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python | 安装 Python
        run: uv python install 3.11

      - name: Build package | 构建包
        run: uv build

      - name: Check dist | 检查产物
        run: |
          ls -la dist/
          echo "构建产物生成成功 ✅"

      - name: Upload artifact | 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
